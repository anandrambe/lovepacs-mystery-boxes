<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lovepacs — Your Recipe Box</title>
<link rel="icon" type="image/png" href="assets/lovepacs-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #F6F4EE;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #0F1A14;
    min-height: 100vh;
  }
  ::selection { background: rgba(11,59,46,0.22); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Dependencies (order matters) -->
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shared.jsx?v=2"></script>
<script type="text/babel" src="boxes-data.jsx"></script>
<script type="text/babel" src="staff.jsx"></script>
<script type="text/babel" src="boxes-public.jsx?v=4"></script>

<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  // Same helper as the main app — builds URL relative to this file's location
  function getPublicUrl(boxId) {
    const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
    return `${base}public.html?box=${encodeURIComponent(boxId)}`;
  }

  function PublicRoot() {
    const urlBoxId = new URLSearchParams(window.location.search).get('box');
    const box = urlBoxId ? MYSTERY_BOXES.find(b => b.id === urlBoxId) : null;

    const palette = PALETTES[TWEAKS.palette] || PALETTES.sweetgreen;
    const type    = TYPE[TWEAKS.typography]  || TYPE['serif-sans'];
    const theme   = useT(palette, type);

    useEffect(() => {
      document.body.style.background  = palette.bg;
      document.body.style.color       = palette.ink;
      document.body.style.fontFamily  = type.body;
    }, []);

    if (!box) {
      return (
        <div style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          padding: 32, textAlign: 'center',
          fontFamily: theme.body, background: palette.bg, color: palette.ink,
        }}>
          <LovepacsMark size={52} color={palette.ink} accent={palette.accent} />
          <div style={{
            fontFamily: theme.display, fontWeight: 600,
            fontSize: 26, marginTop: 24, marginBottom: 10,
          }}>Box not found</div>
          <div style={{ fontSize: 14, color: palette.muted, maxWidth: 300, lineHeight: 1.6 }}>
            This QR code doesn't match any box in our system.
            Please reach out to your local Lovepacs volunteer for help.
          </div>
        </div>
      );
    }

    return <PublicRecipePage theme={theme} box={box} isPreview={false} />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PublicRoot />);
</script>
</body>
</html>
